org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# true only because the unit tests need it: Robolectric (ScreenFitTest, T-31) pulls in
# androidx.test. The app itself has no AndroidX dependency (Robolectric is testImplementation
# only), so nothing of it should reach the release APK: check with
# unzip -p receiver-release.apk classes.dex | strings | grep -c androidx/ after a store build.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
